name: test

on:
  push:
    branches:
      - master
      - main
      - feature/*
      - bugfix/*
  pull_request:
    branches:
      - master
      - main
      - release/*

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    env:
      MONGODB_URI: mongodb://localhost:27017/mean-test
      DATABASE_URI: mongodb://localhost:27017/mean-test
      PAYLOAD_SECRET: ci-test-secret-at-least-thirty-two-chars
      JWT_SECRET: ci-jwt-test-secret-string
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Start MongoDB 7.0
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: '7.0'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Build shared library
        run: npm run build:shared

      - name: Build API service
        run: npm run build:api

      - name: Build storefront app (Vite)
        run: npm run build:app

      - name: Build admin portal (Next.js / PayloadCMS)
        run: npm run build:admin

      - name: Run multi-tenant migrations
        run: npm run migrate

      - name: Run seed data script
        run: npm run seed

      - name: Run unit & domain tests
        run: npm test
